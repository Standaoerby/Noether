<meta charset="utf-8">
<title>Диптих власти — #58 и #42, один скраб</title>
<!--
  diptych.html — E3: two E2 pawn-slices side by side under ONE master scrub.

  The trophy of the вит ок — "the map and the tally lie about power; only the conserved flow
  reveals it" — has lived in two separate cards and in prose. This puts it in ONE frame:
  left, the titled founder who nets MINUS; right, the one the tally called a victim and who is
  the scene's actual sovereign. Same tick, same package, side by side.

  WHAT THIS FILE IS NOT. It computes nothing. Every number it shows is read from the exported
  slice package — the attributed shares came from the card's power projection, which was
  checked against real body deltas by gate PF-SHARE. There is no second implementation here of
  anything, and there is no simulation: canon is not imported, not even indirectly.

  ONE PACKAGE, NOT TWO. `viz/slice/data` already carries both foci (slice.foci = [42, 58]) and
  both card entries; the pane takes its focus from the URL. So the diptych is two views over
  ONE 10.41 MB package — the browser fetches it once per pane and caches. The WO assumed two
  exports; Ф0 measured that one is enough.

  SYNC. The master posts {cmd:'seek', t} to BOTH panes — the β-3 mechanism, reused, not
  reinvented. It is trustworthy only since the front-truth fix: `seek(T)` used to land the
  panes on T+1, so the master's label lied about the moment being shown. Both panes lied
  ALIKE, which is why cross-pane sync looked fine while the TIME was wrong — the failure mode
  a diptych must not have, since its whole claim is "these two things at the same instant".
-->
<style>
:root{--ink:#e8e8ee;--dim:#9a9aa6;--line:#2a2a34;--bg:#0e0f13;--pan:#15161c;
--gold:#ffcf5d;--red:#ff5d6c;--blue:#7fb2ff;--good:#5dd6a0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#top{padding:.7rem 1rem .6rem;border-bottom:1px solid var(--line);background:var(--pan)}
h1{margin:0 0 .25rem;font:600 1rem/1.2 Georgia,serif;letter-spacing:.01em}
#thesis{color:var(--dim);font-size:.85rem;max-width:80rem}
#thesis b{color:var(--ink)}
#heads{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.head{flex:1;background:var(--pan);padding:.5rem 1rem;display:flex;flex-wrap:wrap;
gap:.3rem .6rem;align-items:baseline}
.who{font:600 .95rem Georgia,serif}
.arc{font:600 .62rem/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
border:1px solid currentColor;border-radius:1rem;padding:.2rem .55rem}
.neg{color:var(--red)} .pos{color:var(--good)}
.chip{font-size:.72rem;color:var(--dim);background:#1c1d25;border:1px solid var(--line);
border-radius:1rem;padding:.05rem .5rem;white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
#panes{display:flex;gap:1px;background:var(--line);height:calc(100% - 210px)}
#panes iframe{flex:1;width:50%;height:100%;border:0;background:var(--bg)}
#ctl{display:flex;align-items:center;gap:.7rem;padding:.5rem 1rem;background:var(--pan);
border-top:1px solid var(--line)}
#scrub{flex:1}
button{font:inherit;font-size:.85rem;padding:.2rem .8rem;background:#1c1d25;color:var(--ink);
border:1px solid var(--line);border-radius:.25rem;cursor:pointer}
#tlab{font-variant-numeric:tabular-nums;min-width:6rem}
#beat{padding:.35rem 1rem .6rem;color:var(--dim);font-size:.82rem;background:var(--pan);
border-top:1px solid var(--line);min-height:2.2rem}
#beat b{color:var(--gold)}
</style>

<div id="top">
  <h1>Диптих власти — один тик, две судьбы</h1>
  <div id="thesis">
    Карта и счёт лгут о власти. Слева — <b>титул</b>: держал землю 320 тиков и участвовал в 174
    изъятиях. Справа — та, кого счёт назвал <b>жертвой</b>: её обирали 387 раз. Кто из них
    держал власть, показывает только сохраняющийся поток — он под каждым портретом.
  </div>
</div>

<div id="heads">
  <div class="head" id="hA"></div>
  <div class="head" id="hB"></div>
</div>

<div id="panes">
  <iframe id="fa" title="слайс #58"></iframe>
  <iframe id="fb" title="слайс #42"></iframe>
</div>

<div id="beat"></div>

<div id="ctl">
  <button id="play">▶ играть</button>
  <button id="back">⟨</button><button id="fwd">⟩</button>
  <input type="range" id="scrub" min="1" max="400" value="1">
  <span id="tlab">день —</span>
</div>

<script>
// TWO paths to ONE directory, and they differ on purpose. The panes are iframes rooted at
// /glass/, so a relative data path inside them resolves against THAT, not against this page:
// "./slice/data" sent to a pane becomes /glass/slice/data and 404s silently (the pane just
// shows its drop-zone, which is exactly how this was caught — by loading it, not by reading).
const DATA_PANE = "../slice/data";   // as the pane resolves it (relative to /glass/)
const DATA_SELF = "./slice/data";    // as this page resolves it
const LEFT = 58, RIGHT = 42;
const fa = document.getElementById("fa"), fb = document.getElementById("fb");
const scrub = document.getElementById("scrub"), tlab = document.getElementById("tlab");
let cards = null, playing = false, timer = null;

// ONE package, both panes. embed=1 hides each pane's own chrome — the master owns the
// controls, and two copies of them is what makes a two-pane view unreadable. That parameter
// only started working with the front-truth fix; before it, it was a comment and nothing more.
fa.src = `glass/index.html?data=${encodeURIComponent(DATA_PANE)}&focus=${LEFT}&embed=1`;
fb.src = `glass/index.html?data=${encodeURIComponent(DATA_PANE)}&focus=${RIGHT}&embed=1`;

// the master drives BOTH panes to the SAME tick — this is the whole claim of a diptych
function seek(t) {
  tlab.textContent = "день " + t;
  for (const f of [fa, fb]) {
    try { f.contentWindow.postMessage({ cmd: "seek", t: +t }, "*"); } catch (e) {}
  }
  paintBeat(+t);
}
scrub.addEventListener("input", () => { playing = false; stop(); seek(+scrub.value); });
document.getElementById("back").onclick = () => { scrub.value = Math.max(1, +scrub.value - 1); seek(+scrub.value); };
document.getElementById("fwd").onclick  = () => { scrub.value = Math.min(+scrub.max, +scrub.value + 1); seek(+scrub.value); };
function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ играть"; }
document.getElementById("play").onclick = function () {
  playing = !playing;
  this.textContent = playing ? "❚❚ пауза" : "▶ играть";
  if (playing) {
    timer = setInterval(() => {
      let v = +scrub.value + 1;
      if (v > +scrub.max) { v = 1; }
      scrub.value = v; seek(v);
    }, 90);
  } else stop();
};

// ---- the heads: labels backed by the card's OWN numbers, never recomputed here ---------- //
function head(el, oid, e) {
  const T = e.card.power.totals, R = e.card.power.roles;
  const net = T.net;
  el.innerHTML =
    `<span class="who">#${oid}</span>` +
    `<span class="arc ${net < 0 ? "neg" : "pos"}">${esc(e.arc)}</span>` +
    `<span class="chip">нетто по властным потокам: <b class="${net < 0 ? "neg" : "pos"}">` +
    `${net > 0 ? "+" : ""}${net.toFixed(2)} кг</b></span>` +
    `<span class="chip">рента получена: <b>${T.rent_received.toFixed(2)}</b></span>` +
    `<span class="chip">рента уплачена: <b>${T.rent_paid.toFixed(2)}</b></span>` +
    `<span class="chip">изъятий с её участием: <b>${R.extort.taker}</b></span>` +
    `<span class="chip">изъятий против неё: <b>${R.extort.victim}</b></span>` +
    `<span class="chip">приписано ей: <b>${T.extort_attributed.toFixed(2)} кг</b> ` +
    `из брутто ${T.extort_gross.toFixed(2)}</span>`;
}
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ---- the beat line: the contrast, led by the SAME events the panes draw ----------------- //
function paintBeat(t) {
  if (!cards) return;
  const say = [];
  for (const oid of [LEFT, RIGHT]) {
    const caps = (cards.entries[String(oid)].captions || {}).items || [];
    const now = caps.filter((c) => c.t === t);
    for (const c of now) say.push(`<b>#${oid}, день ${c.t}:</b> ${esc(c.text)}`);
  }
  document.getElementById("beat").innerHTML =
    say.length ? say.join(" &nbsp;·&nbsp; ")
               : '<span style="opacity:.45">в этот день ни с одной из них ничего не случилось</span>';
}

fetch(DATA_SELF + "/cards.json").then((r) => r.json()).then((j) => {
  cards = j;
  head(document.getElementById("hA"), LEFT, j.entries[String(LEFT)]);
  head(document.getElementById("hB"), RIGHT, j.entries[String(RIGHT)]);
  const tEnd = (j.entries[String(RIGHT)].captions || {}).t_end || 400;
  scrub.max = tEnd;
  seek(1);
});
</script>
